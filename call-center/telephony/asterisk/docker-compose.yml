services:
  asterisk:
    image: andrius/asterisk:20
    restart: unless-stopped
    ports:
      - "5060:5060/udp"
      - "8088:8088"
      - "8089:8089"
      - "10000-10100:10000-10100/udp"
    volumes:
      - ./config:/etc/asterisk
      - ./recordings:/var/spool/asterisk/recording
    environment:
      - TZ=UTC
