<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Alpha Nation Call Center</title><style>:root{font-family:Inter,system-ui,sans-serif;color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#090b10;color:#f5f7fa}header{padding:16px 22px;border-bottom:1px solid #252936;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#0d1017;z-index:2}main{padding:20px;max-width:1500px;margin:auto}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card,.panel{background:#11151d;border:1px solid #272d38;border-radius:12px;padding:16px}.metric{font-size:28px;font-weight:750}.muted{color:#929baa;font-size:13px}.grid{display:grid;grid-template-columns:1.4fr .8fr;gap:16px}.wide{margin-top:16px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid #232832}.row:last-child{border:0}.pill{padding:5px 9px;border-radius:999px;background:#202631;font-size:12px}.on{background:#153b2b;color:#79e2a9}.pause{background:#463916;color:#f1d27a}.call{background:#213d5c;color:#9bc9ff}.wrap{background:#392452;color:#d9b6ff}button{background:#e9edf2;color:#0b0d11;border:0;border-radius:8px;padding:9px 12px;font-weight:650;cursor:pointer}button.secondary{background:#242a34;color:#f5f7fa}.actions{display:flex;gap:7px;flex-wrap:wrap}.mono{font-variant-numeric:tabular-nums;font-family:ui-monospace,monospace}.select{background:#111722;color:#fff;border:1px solid #303744;border-radius:8px;padding:9px;width:100%;margin:8px 0}.nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.nav button{background:#171c25;color:#ddd}.nav button.active{background:#2a3242}@media(max-width:900px){.grid{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:550px){.cards{grid-template-columns:1fr 1fr}.row{align-items:flex-start}}
</style></head><body><header><div><strong>ALPHA NATION</strong><span class="muted"> / Call Center</span></div><div class="muted" id="connection">Backend: connecting</div></header><main><div class="nav"><button class="active">Supervisor</button><button onclick="agentMode()">Agent Console</button><select class="select" style="width:180px;margin:0" id="campaign"><option value="FE-CPA">FE CPA</option><option value="FE-CPL">FE CPL</option></select><button onclick="dialNext()">Dial Next Lead</button></div><section class="cards"><div class="card"><div class="muted">Agents Online</div><div class="metric" id="online">0</div></div><div class="card"><div class="muted">On Call</div><div class="metric" id="oncall">0</div></div><div class="card"><div class="muted">Available</div><div class="metric" id="available">0</div></div><div class="card"><div class="muted">Paused</div><div class="metric" id="paused">0</div></div></section><section class="grid wide"><div class="panel"><h2>Live Agents</h2><div id="agents"><div class="muted">Waiting for backend data...</div></div></div><div class="panel"><h2>Active Call</h2><div id="active"><div class="muted">Select an on-call agent.</div></div></div></section><section class="panel wide"><h2>Recent Calls</h2><div id="calls" class="muted">No calls yet.</div></section></main><script>
const API=(location.protocol==='file:'?'http://localhost:8080':'');let agents=[],calls=[],selected=null;const agentId=localStorage.getItem('alpha_agent_id')||'demo-agent';
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const fmt=s=>{s=Math.max(0,Math.floor(s||0));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};const elapsed=t=>t?fmt((Date.now()-new Date(t))/1000):'00:00';
async function get(p){try{const r=await fetch(API+'/api'+p);if(!r.ok)throw 0;return await r.json()}catch{return null}}
async function refresh(){const [a,c]=await Promise.all([get('/agents'),get('/calls')]);if(a){agents=a;$('connection').textContent='Backend: connected'}else $('connection').textContent='Backend: offline';if(c)calls=c;render()}
function $(x){return document.getElementById(x)}
function render(){const live=agents.filter(a=>a.status!=='offline');$('online').textContent=live.length;$('oncall').textContent=agents.filter(a=>a.status==='on_call'||a.status==='ringing').length;$('available').textContent=agents.filter(a=>a.status==='available').length;$('paused').textContent=agents.filter(a=>a.status==='paused').length;$('agents').innerHTML=agents.length?agents.map(a=>`<div class="row"><div><strong>${esc(a.displayName||a.id)}</strong><div class="muted">${esc(a.campaignId||'No campaign')}${a.pauseCode?' · '+esc(a.pauseCode):''}</div></div><div><span class="pill ${a.status==='on_call'?'call':a.status==='paused'?'pause':a.status==='wrap_up'?'wrap':a.status==='available'?'on':''}">${esc((a.status||'offline').replace('_',' '))} <span class="mono">${elapsed(a.statusStartedAt)}</span></span>${a.status==='on_call'?` <button class="secondary" onclick="selectAgent('${esc(a.id)}')">Monitor</button>`:''}</div></div>`).join(''):'<div class="muted">No agents connected.</div>';$('calls').innerHTML=calls.length?calls.slice().reverse().slice(0,20).map(c=>`<div class="row"><div><strong>${esc(c.id.slice(0,8))}</strong><div class="muted">${esc(c.agentId||'-')} · ${esc(c.campaignId||'-')}</div></div><span class="pill">${esc(c.state)}</span></div>`).join(''):'No calls yet.';if(selected)selectAgent(selected.id)}
function selectAgent(id){selected=agents.find(a=>a.id===id);if(!selected)return;$('active').innerHTML=`<strong>${esc(selected.displayName||selected.id)}</strong><div class="muted">${esc(selected.campaignId||'-')} · ${esc(selected.status)}</div><div class="actions" style="margin-top:14px"><button onclick="monitor('listen')">Listen</button><button class="secondary" onclick="monitor('whisper')">Whisper</button><button class="secondary" onclick="monitor('barge')">Barge</button><button class="secondary" onclick="transferCall()">Transfer</button></div>`}
async function setStatus(status){await fetch(API+'/api/agents/'+encodeURIComponent(agentId)+'/status',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({status})});refresh()}
async function dialNext(){const campaign=$('campaign').value;const r=await fetch(API+'/api/campaigns/'+encodeURIComponent(campaign)+'/dial-next',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({agentId})});const data=await r.json().catch(()=>({}));if(!r.ok)alert(data.error||'Dialer unavailable');refresh()}
function monitor(mode){if(!selected)return alert('Select an on-call agent first.');alert(mode.toUpperCase()+' requested for '+(selected.displayName||selected.id)+'. Backend telephony authorization is required.')}
function transferCall(){if(!selected)return alert('Select an on-call agent first.');alert('Transfer requested. Destination selection will be enabled with the telephony integration.')}
function agentMode(){const n=prompt('Agent name',localStorage.getItem('alpha_agent_name')||'Agent');if(n){localStorage.setItem('alpha_agent_name',n);localStorage.setItem('alpha_agent_id',agentId);setStatus('available')}}
refresh();setInterval(refresh,2000);setInterval(render,1000);
</script></body></html>
