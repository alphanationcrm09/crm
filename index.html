<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
async function downloadModuleCSV(p){
 const c=configs[p];if(!c){toast("Module unavailable.",true);return}
 const r=await db.from(c.table).select("*").limit(5000);if(r.error){toast(r.error.message,true);return}
 const rows=r.data||[],headers=c.cols.map(x=>x[1]),fields=c.cols.map(x=>x[0]);
 const escCsv=v=>{const x=String(v??"").replace(/\r?\n/g," ");return /[",]/.test(x)?`"${x.replace(/"/g,'""')}"`:x};
 const csv=[headers.map(escCsv).join(","),...rows.map(row=>fields.map(f=>escCsv(row[f])).join(","))].join("\r\n");
 const blob=new Blob(["\ufeff"+csv],{type:"text/csv;charset=utf-8;"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`alpha-nation-${p}.csv`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),500);toast(`Exported ${rows.length} ${c.title.toLowerCase()}.`);
}

</script>

<script>
/* Signature Alpha Nation intro: hundreds of small luminous particles assemble into AN. */
function alphaIntroLogoSvg(){
 return `<svg viewBox="0 0 300 150" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
 <defs><linearGradient id="anG" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6fd4ff"/><stop offset=".5" stop-color="#087dff"/><stop offset="1" stop-color="#eef8ff"/></linearGradient><filter id="anGlow"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
 <g fill="none" stroke="url(#anG)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" filter="url(#anGlow)">
 <path d="M42 112 99 22l58 90"/><path d="M66 77h68"/><path d="M142 22v90"/><path d="m142 22 59 90"/><path d="M201 112V22"/>
 </g></svg>`;
}
function alphaParticleIntro(){
  const overlay=document.getElementById("alphaParticleIntro");
  const canvas=document.getElementById("alphaParticleCanvas");
  const logo=document.getElementById("alphaIntroLogo");
  if(!overlay||!canvas||!logo)return Promise.resolve();

  logo.innerHTML=alphaIntroLogoSvg();
  overlay.className="show";
  const ctx=canvas.getContext("2d");
  if(!ctx)return new Promise(resolve=>setTimeout(resolve,6600));

  const dpr=Math.min(devicePixelRatio||1,2);
  const W=innerWidth,H=innerHeight,cx=W/2,cy=H*.47;
  canvas.width=W*dpr;canvas.height=H*dpr;
  canvas.style.width=W+"px";canvas.style.height=H+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);

  // The particle target is generated from the exact same AN SVG used for the final logo.
  // This prevents stray diagonal/vertical target paths and guarantees the particles form only AN.
  const mask=document.createElement("canvas");
  const mw=600,mh=300; mask.width=mw; mask.height=mh;
  const mctx=mask.getContext("2d");
  const svg=alphaIntroLogoSvg().replace('<svg ','<svg width="600" height="300" ');
  const img=new Image();
  const svgUrl="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg);

  return new Promise(resolve=>{
    img.onload=()=>{
      mctx.clearRect(0,0,mw,mh);mctx.drawImage(img,0,0,mw,mh);
      const px=mctx.getImageData(0,0,mw,mh).data;
      const target=[];
      const step=2;
      let minX=mw,maxX=0,minY=mh,maxY=0;
      for(let y=0;y<mh;y+=step){
        for(let x=0;x<mw;x+=step){
          if(px[(y*mw+x)*4+3]>90){
            target.push({x,y});
            if(x<minX)minX=x;
            if(x>maxX)maxX=x;
            if(y<minY)minY=y;
            if(y>maxY)maxY=y;
          }
        }
      }
      if(!target.length){overlay.classList.remove("show");resolve();return}

      // Crop to the actual visible AN logo bounds.
      const pad=8;
      minX=Math.max(0,minX-pad); maxX=Math.min(mw,maxX+pad);
      minY=Math.max(0,minY-pad); maxY=Math.min(mh,maxY+pad);
      const bw=maxX-minX, bh=maxY-minY;

      const count=Math.min(1500,Math.max(850,Math.floor(W*H/900)));
      const particles=[];
      const desiredW=Math.min(W*.56,620);
      const scale=desiredW/bw;
      const desiredH=bh*scale;
      const ox=cx-(bw*scale)/2, oy=cy-(desiredH/2);

      for(let i=0;i<count;i++){
        const t=target[(i*37)%target.length];
        const a=Math.random()*Math.PI*2;
        const radius=Math.max(W,H)*(.34+Math.random()*.32);
        particles.push({
          x:cx+Math.cos(a)*radius,
          y:cy+Math.sin(a)*radius*.68,
          tx:ox+(t.x-minX)*scale+(Math.random()-.5)*1.1,
          ty:oy+(t.y-minY)*scale+(Math.random()-.5)*1.1,
          size:.45+Math.random()*1.2,
          delay:Math.random()*.30
        });
      }

      const formationStart=performance.now(),formationDuration=4500;
      function frame(now){
        const p=Math.min(1,(now-formationStart)/formationDuration);
        ctx.clearRect(0,0,W,H);
        for(const q of particles){
          const local=Math.max(0,Math.min(1,(p-q.delay*.45)/.84));
          const k=local*local*(3-2*local);
          const x=q.x+(q.tx-q.x)*k;
          const y=q.y+(q.ty-q.y)*k;
          ctx.beginPath();ctx.arc(x,y,q.size,0,Math.PI*2);
          ctx.fillStyle=`rgba(80,188,255,${.08+k*.92})`;
          ctx.shadowBlur=k>.78?6:2;ctx.shadowColor="rgba(25,145,255,.85)";ctx.fill();
        }
        ctx.shadowBlur=0;
        if(p<1){requestAnimationFrame(frame);return}

        // At exactly 4.5 seconds the particles are already sitting on the clean AN target.
        ctx.clearRect(0,0,W,H);
        overlay.classList.add("logo-ready");
        setTimeout(()=>{
          overlay.classList.add("exit");
          setTimeout(()=>{
            overlay.classList.remove("show","exit","logo-ready");
            ctx.clearRect(0,0,W,H);
          },550);
        },2100);
      }
      requestAnimationFrame(frame);
      setTimeout(resolve,6600);
    };
    img.onerror=()=>{overlay.classList.remove("show");resolve()};
    img.src=svgUrl;
  });
}

function retentionInfo(row){const status=String(row?.retention_status||"Retention going");if(status==="Retained")return {label:"Retained",date:null};if(status==="Chargeback")return {label:"Chargeback",date:null};const base=policyDate(row);const months=Number(row?.retention_month);if(!base||!Number.isFinite(months)||months<=0)return {label:"Retention going",date:null};const due=addMonthsSafe(base,months);if(!due)return {label:"Retention going",date:null};const days=Math.ceil((new Date(due.getFullYear(),due.getMonth(),due.getDate())-new Date())/86400000);return {label:days>0?`Retention going · ${days}d left`:days===0?"Retention going · Due today":"Retention going · Overdue",date:due.toISOString().slice(0,10)}}

function calculateRetentionFromDrafts(policy, successfulDraftCount){
  const buyer=String(policy?.buyer_name||policy?.buyer||"").trim().toLowerCase();
  const required=buyer.includes("stevey") ? 1 : buyer.includes("david") ? 2 : null;
  if(!required) return policy?.retention_status;
  if(successfulDraftCount>=required) return "Retained";
  if(policy?.retention_status==="Retained") return "Retention going";
  return policy?.retention_status;
}
function normalizePolicyFinancialState(p){
  if(!p)return p;
  const draft=String(p.first_draft_status||"").trim().toLowerCase();
  const buyerPay=String(p.commission_status||"").trim().toLowerCase();

  // Buyer payment and customer draft are independent states.
  // Never convert Paid into a successful customer draft.
  // Never convert a successful draft into Paid automatically.
  if(buyerPay==="chargeback"){
    p.commission_status="Chargeback";
  }else if(buyerPay==="waiting for draft"){
    p.commission_status="Waiting for Draft";
  }else if(buyerPay==="paid"){
    p.commission_status="Paid";
  }

  // Keep customer draft status independent.
  if(draft==="cleared") p.first_draft_status="Cleared";
  else if(draft==="failed") p.first_draft_status="Failed";
  else if(draft==="pending") p.first_draft_status="Pending";

  return p;
}

function auditFriendlyField(k){
  const labels={
    customer_name:"Customer",team_id:"Team",buyer_id:"Buyer",carrier_id:"Carrier",campaign_id:"Campaign",
    approval_status:"Approval Status",commission_status:"Commission Status",commission_amount:"Commission Amount",
    agreed_payout:"Amount Payable",chargeback_amount:"Chargeback Amount",retention_status:"Retention",
    first_draft_status:"Draft Status",first_draft_date:"First Draft Date",first_premium_amount:"First Premium Amount",
    draft_schedule:"Draft Schedule",submitted_at:"Submission Date",approved_at:"Approval Date",effective_date:"Effective Date",
    retention_due_date:"Retention Due Date",retention_month:"Retention Period",premium:"Premium",policy_number:"Policy Number",
    state:"State",product:"Product",plan_type:"Level/GI",premium_frequency:"Premium Frequency",notes:"Updates / Notes",
    internal_notes:"Internal Notes",display_policy_id:"Policy ID"
  };
  return labels[k]||k.replace(/_/g," ").replace(/\b\w/g,m=>m.toUpperCase());
}
function auditDiff(before,after){
  const a=before&&typeof before==="object"?before:{},b=after&&typeof after==="object"?after:{};
  const keys=[...new Set([...Object.keys(a),...Object.keys(b)])].filter(k=>!["updated_at","created_at"].includes(k));
  return keys.filter(k=>JSON.stringify(a[k]??null)!==JSON.stringify(b[k]??null)).map(k=>({
    field:auditFriendlyField(k),before:a[k],after:b[k]
  }));
}

}

async function resetUserPassword(row){
 if(!row?.id){toast("User is missing.",true);return}
 if(!isOwner() && profile?.role!=="Admin"){toast("Only Owner or Admin can update passwords.",true);return}
 if(profile?.role==="Admin" && row.id!==user?.id && row.role!=="Team"){toast("Admins can update their own password or Team passwords only.",true);return}
 if(!confirm(`Generate and update a new password for ${row.full_name||row.email}?`))return;
 const r=await db.functions.invoke("alpha-reset-team-password",{body:{user_id:row.id}});
 if(r.error){toast(r.error.message,true);return}
 const generated=r.data?.password;
 if(!generated){toast("Password was updated, but the generated password was not returned.",true);return}
 prompt(`New password for ${row.full_name||row.email}. Copy it now:`,generated);
 toast("Password generated and updated successfully.");
}
function showRecoveryPasswordForm(){
 if(!isOwner() && profile?.role!=="Admin"){toast("Password management is restricted to Owner and Admin.",true);return}
 const row={id:user?.id,full_name:profile?.full_name||"My account",email:profile?.email||user?.email,role:profile?.role};
 resetUserPassword(row);
}

async function csvImport(p){const c=configs[p];const input=document.createElement("input");input.type="file";input.accept=".csv,text/csv";input.onchange=async()=>{const file=input.files?.[0];if(!file)return;const text=await file.text();const lines=text.split(/\r?\n/).filter(Boolean);if(lines.length<2){toast("CSV has no data rows.",true);return}const headers=parseCSVLine(lines[0]);const csvRows=lines.slice(1).map(parseCSVLine);const map=c.cols.map(col=>({field:col[0],label:col[1],header:headers.find(h=>h.toLowerCase().trim()===col[1].toLowerCase().trim())||headers.find(h=>h.toLowerCase().trim()===col[0].toLowerCase().trim())}));const matched=map.filter(x=>x.header);if(!matched.length){toast("No CSV columns matched this module.",true);return}if(!confirm(`Import ${csvRows.length} rows into ${c.title}?`))return;let ok=0,fail=0;const [carrierRes,buyerRes,campaignRes]=await Promise.all([db.from("carriers").select("id,name"),db.from("buyers").select("id,company_name"),db.from("campaigns").select("id,name")]);const carriers=carrierRes.data||[],buyers=buyerRes.data||[],campaigns=campaignRes.data||[];const findId=(list,value,label)=>{const raw=String(value??"").trim();if(!raw)return null;const norm=label==="carrier"?normalizeCarrierAlias(raw):raw;const hit=list.find(x=>{const labelValue=String(x.name||x.company_name||"").trim();const candidate=label==="carrier"?normalizeCarrierAlias(labelValue):labelValue;return candidate.toLowerCase()===norm.toLowerCase()});return hit?.id||null};for(let i=0;i<csvRows.length;i+=100){const batch=csvRows.slice(i,i+100).map(vals=>{const o={};matched.forEach(m=>{let v=vals[headers.indexOf(m.header)]||null;if(p==="policies"){if(m.field==="state"||m.field==="state_of_residence"||m.field==="born_state")v=normalizeState(v);if(m.field==="carrier_id")v=findId(carriers,v,"carrier");if(m.field==="buyer_id")v=findId(buyers,v,"buyer");if(m.field==="campaign_id")v=findId(campaigns,v,"campaign")}o[m.field]=v});return o});const r=await db.from(c.table).insert(batch);if(r.error)fail+=batch.length;else ok+=batch.length}toast(`Imported ${ok} rows${fail?`, ${fail} failed`:""}`);await loadTable(p)};input.click()}
function parseCSVLine(line){const out=[];let cur="",q=false;for(let i=0;i<line.length;i++){const ch=line[i];if(ch==='"'){if(q&&line[i+1]==='"'){cur+='"';i++}else q=!q}else if(ch===','&&!q){out.push(cur.trim());cur=""}else cur+=ch}out.push(cur.trim());return out}
async function startPresence(){if(!user?.id)return;if(presenceChannel){try{await db.removeChannel(presenceChannel)}catch(_){}presenceChannel=null}presenceChannel=db.channel("alpha-nation-crm-presence",{config:{presence:{key:user.id}}});const refresh=()=>{const st=presenceChannel.presenceState();const next={};Object.keys(st||{}).forEach(k=>{if((st[k]||[]).length)next[k]=true});presenceState=next;if(current==="users")usersPage()};presenceChannel.on("presence",{event:"sync"},refresh).on("presence",{event:"join"},refresh).on("presence",{event:"leave"},refresh);await new Promise((resolve,reject)=>{let done=false;presenceChannel.subscribe(async status=>{if(done)return;if(status==="SUBSCRIBED"){try{await presenceChannel.track({userId:user.id,online_at:new Date().toISOString()});done=true;resolve()}catch(e){done=true;reject(e)}}else if(status==="CHANNEL_ERROR"||status==="TIMED_OUT"){done=true;reject(new Error("Realtime presence unavailable."))}})})}

/* lightweight background particles; no giant overlay, no blocking layer */
const canvas=$("particleCanvas"),ctx=canvas.getContext("2d");let dots=[];function resize(){canvas.width=innerWidth*devicePixelRatio;canvas.height=innerHeight*devicePixelRatio;canvas.style.width=innerWidth+"px";canvas.style.height=innerHeight+"px";ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);dots=Array.from({length:Math.min(120,Math.floor(innerWidth*innerHeight/9000))},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:.4+Math.random()*1.4,v:.08+Math.random()*.22,a:.25+Math.random()*.7}))}function particles(){if(document.hidden)return;ctx.clearRect(0,0,innerWidth,innerHeight);for(const d of dots){d.y-=d.v;if(d.y<0)d.y=innerHeight;ctx.globalAlpha=d.a;ctx.fillStyle="#39b9ff";ctx.beginPath();ctx.arc(d.x,d.y,d.r,0,Math.PI*2);ctx.fill()}requestAnimationFrame(particles)}addEventListener("resize",resize);resize();particles();
</script>
<div id="alphaPageTransition" aria-hidden="true"><div class="travel-logo" id="alphaTravelLogo"></div></div><script id="alphaPageTransitionJS">
(function(){
  function startAlphaPageTransition(target){
    const overlay=document.getElementById("alphaPageTransition");
    const logo=document.getElementById("alphaTravelLogo");
    const content=document.getElementById("content");
    if(!overlay||!logo)return;
    try{
      if(typeof alphaIntroLogoSvg==="function") logo.innerHTML=alphaIntroLogoSvg();
      else {
        const existing=document.querySelector("#alphaParticleIntro svg");
        if(existing) logo.innerHTML=existing.outerHTML;
      }
    }catch(e){}
    const rect=target&&target.getBoundingClientRect?target.getBoundingClientRect():null;
    const cx=innerWidth/2,cy=innerHeight/2;
    const tx=rect?rect.left+rect.width/2:cx,ty=rect?rect.top+rect.height/2:cy;
    const dx=Math.max(-1,Math.min(1,(tx-cx)/(innerWidth/2||1)));
    const dy=Math.max(-1,Math.min(1,(ty-cy)/(innerHeight/2||1)));
    overlay.style.setProperty("--alpha-x-start",Math.round(-dx*90)+"px");
    overlay.style.setProperty("--alpha-y-start",Math.round(-dy*70)+"px");
    overlay.style.setProperty("--alpha-x-mid",Math.round(dx*20)+"px");
    overlay.style.setProperty("--alpha-y-mid",Math.round(dy*16)+"px");
    overlay.style.setProperty("--alpha-x-end",Math.round(dx*90)+"px");
    overlay.style.setProperty("--alpha-y-end",Math.round(dy*70)+"px");
    document.body.style.setProperty("--alpha-page-out-x",Math.round(dx*10)+"px");
    document.body.style.setProperty("--alpha-page-out-y",Math.round(dy*10)+"px");
    document.body.style.setProperty("--alpha-page-in-x",Math.round(-dx*10)+"px");
    document.body.style.setProperty("--alpha-page-in-y",Math.round(-dy*10)+"px");
    document.body.classList.add("alpha-page-transitioning");
    if(content)content.classList.remove("alpha-page-entering");
    overlay.classList.remove("active");
    void overlay.offsetWidth;
    overlay.classList.add("active");
    setTimeout(()=>{if(content){content.classList.remove("alpha-page-entering");void content.offsetWidth;content.classList.add("alpha-page-entering")}},210);
    setTimeout(()=>{overlay.classList.remove("active");document.body.classList.remove("alpha-page-transitioning");if(content)content.classList.remove("alpha-page-entering")},680);
  }
  window.alphaNationPageTransition=startAlphaPageTransition;
  document.addEventListener("click",function(e){
    const t=e.target.closest("#backToBuyers,.buyer-open,.buyer-policy-edit");
    if(!t)return;
    startAlphaPageTransition(t);
  },true);
})();
