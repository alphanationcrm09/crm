<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Alpha Nation Quote Calculator</title><style>body{font-family:Arial;background:#050a10;color:#fff;margin:0;padding:16px}.box{max-width:1100px;margin:auto;background:#0b1622;padding:16px;border-radius:12px;margin-bottom:14px}label{display:block;margin:8px 0 4px;color:#9aaabd}input,select,button{padding:10px;border-radius:7px;border:1px solid #29415a;background:#050b12;color:#fff}button{background:#096edc;font-weight:bold;cursor:pointer}.carriers,.faces,.info{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.carrier{padding:10px;border:1px solid #29415a;border-radius:7px}.carrier input{width:auto}.info{grid-template-columns:repeat(3,1fr)}table{width:100%;border-collapse:collapse;margin-top:15px}th,td{padding:9px;border-bottom:1px solid #23394b;text-align:left}.scroll{overflow:auto}@media(max-width:700px){.carriers,.faces,.info{grid-template-columns:1fr 1fr}}@media(max-width:450px){.carriers,.faces,.info{grid-template-columns:1fr}}</style></head><body><main><div class="box"><h2>Alpha Nation Final Expense Quote Calculator</h2><div class="carriers"><label class="carrier"><input class="c" value="American Amicable" checked> American Amicable</label><label class="carrier"><input class="c" value="Mutual of Omaha" checked> Mutual of Omaha</label><label class="carrier"><input class="c" value="CICA Life" checked> CICA Life</label><label class="carrier"><input class="c" value="Royal Neighbors" checked> Royal Neighbors</label><label class="carrier"><input class="c" value="TransAmerica" checked> TransAmerica</label></div></div><div class="box"><div class="info"><div><label>Age</label><input id="age" type="number" value="70" min="40" max="89"></div><div><label>Sex</label><select id="sex"><option value="F">Female</option><option value="M">Male</option></select></div><div><label>Tobacco</label><select id="t"><option value="N">Non-smoker</option><option value="S">Smoker</option></select></div></div><label>Coverage amounts</label><div class="faces"><input class="f" value="2500"><input class="f" value="3500"><input class="f" value="5000"><input class="f" value="10000"><input class="f" value="25000"></div><button onclick="go()" style="margin-top:12px">Get Quotes</button></div><div class="box"><div id="msg">Select carriers and Get Quotes.</div><div class="scroll"><table><thead><tr><th>Carrier</th><th>Product</th><th>Plan</th><th>Face</th><th>Method</th><th>Monthly</th><th>Status</th></tr></thead><tbody id="o"></tbody></table></div></div><iframe id="e" src="index.html" hidden></iframe></main><script>function go(){let w=document.getElementById('e').contentWindow,cs=[...document.querySelectorAll('.c:checked')].map(x=>x.value),age=+document.getElementById('age').value,s=document.getElementById('sex').value,t=document.getElementById('t').value,fs=[...document.querySelectorAll('.f')].map(x=>+x.value);let d=(w.D||[]).filter(r=>cs.includes(r.c)&&r.s===s&&r.t===t&&fs.includes(+r.f)&&age===70);d.sort((a,b)=>a.x-b.x);document.getElementById('msg').textContent=d.length?d.length+' exact loaded quotes found across '+new Set(d.map(x=>x.c)).size+' carrier(s).':'No exact loaded rate for this combination. No estimate was made.';document.getElementById('o').innerHTML=d.map(r=>`<tr><td>${r.c}</td><td>${r.p}</td><td>${r.pl}</td><td>$${r.f.toLocaleString()}</td><td>${r.m}</td><td>$${Number(r.x).toFixed(2)}</td><td>${r.status}</td></tr>`).join('')}</script></body></html>
